<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · ИИ-продажник</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="center">
  <form method="post" action="/login" class="card login">
    <img src="/static/logo.webp" alt="ASCN.AI" class="logo">
    <h1>ИИ-продажник</h1>
    <p class="tag">Панель управления</p>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <div class="field">
      <label>Логин</label>
      <input type="text" name="login" autofocus autocomplete="username">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" name="password" autocomplete="current-password">
    </div>
    <button class="btn block" type="submit">Войти</button>
  </form>
</body>
</html>
