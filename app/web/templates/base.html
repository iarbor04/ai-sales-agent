<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ИИ-продажник{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">ИИ-продажник</div>
    <nav>
      <a href="/" class="{{ 'active' if path == '/' }}">Обзор</a>
      <a href="/dialogs" class="{{ 'active' if path.startswith('/dialogs') }}">
        Диалоги {% if unread %}<span class="badge">{{ unread }}</span>{% endif %}
      </a>
      <a href="/leads" class="{{ 'active' if path.startswith('/leads') }}">Лиды</a>
      <a href="/knowledge" class="{{ 'active' if path.startswith('/knowledge') }}">База знаний</a>
      <a href="/broadcast" class="{{ 'active' if path.startswith('/broadcast') }}">Рассылки</a>
      <a href="/settings" class="{{ 'active' if path.startswith('/settings') }}">Настройки</a>
      <a href="/logout" class="muted">Выйти</a>
    </nav>
    <div class="aistate {{ 'on' if ai_on else 'off' }}">
      ИИ {{ 'включён' if ai_on else 'выключен' }}
    </div>
  </aside>
  <main class="main">
    {% block body %}{% endblock %}
  </main>
</div>
</body>
</html>
